name: Release guard

# Cutting a version tag without ever creating the matching GitHub Release
# (and uploading the installer to it) is exactly what left
# CamAI-Desktop-Setup-1.0.0.exe returning 404 for weeks: the tag existed,
# a build existed on someone's machine, but no Release object and no asset
# ever reached GitHub. This workflow can't build the installer itself — the
# AI engine and model weights it bundles are gitignored/proprietary and
# aren't on this runner (see docs/DEPLOYMENT.md) — so instead it verifies,
# every time a version tag is pushed, that `npm run release` was actually
# run and actually finished: a non-draft Release exists for the tag and it
# has a Windows installer attached. A red X here is the earliest possible
# signal that a release shipped a tag but not a download.

'on':
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify-release-published:
    runs-on: ubuntu-latest
    steps:
      - name: Check release + installer asset exist for ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Looking for a published (non-draft) release at tag $TAG in $REPO..."

          release_json="$(gh api "repos/$REPO/releases/tags/$TAG" 2>/dev/null || true)"
          if [ -z "$release_json" ]; then
            echo "::error::No GitHub Release found for tag $TAG. Run 'npm run release' (or 'release:full') from desktop/ on a build machine with the engine + models — see docs/DEPLOYMENT.md."
            exit 1
          fi

          is_draft="$(echo "$release_json" | jq -r '.draft')"
          if [ "$is_draft" = "true" ]; then
            echo "::error::Release for tag $TAG exists but is still a draft — the asset upload likely didn't finish."
            exit 1
          fi

          has_installer="$(echo "$release_json" | jq -r '[.assets[].name | select(test("\\.(exe|msi)$"))] | length')"
          if [ "$has_installer" -eq 0 ]; then
            echo "::error::Release for tag $TAG has no .exe/.msi asset attached."
            exit 1
          fi

          has_checksum="$(echo "$release_json" | jq -r '[.assets[].name | select(test("\\.sha256$"))] | length')"
          if [ "$has_checksum" -eq 0 ]; then
            echo "::warning::Release for tag $TAG has no .sha256 checksum asset attached."
          fi

          echo "OK: tag $TAG has a published release with $has_installer installer asset(s)."
