project_id = "camai"

[api]
enabled = true
port = 54321
schemas = ["public", "app", "storage"]

[db]
port = 54322
major_version = 15

[auth]
enabled = true
site_url = "https://portal-gilt-iota.vercel.app"
additional_redirect_urls = [
  "http://localhost:5174",
  "https://portal-gilt-iota.vercel.app",
  "camai-desktop://auth",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = true
enable_confirmations = false

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "500MiB"

[functions.activate-license]
verify_jwt = false   # activation happens before any session exists

[functions.my-keys]
verify_jwt = true

[functions.desktop-sync]
verify_jwt = true

[functions.invite-user]
verify_jwt = true

[functions.add-camera]
verify_jwt = true

[functions.admin-users]
verify_jwt = true

[functions.send-email]
verify_jwt = false   # called only by Postgres (pg_net) with the service-role key; checked by hand in the function

[functions.decrypt-camera]
verify_jwt = true

[functions.test-camera]
verify_jwt = true

[functions.download-release]
verify_jwt = true

[functions.github-releases]
verify_jwt = false   # public release metadata; still rate-limited per-IP in the function
