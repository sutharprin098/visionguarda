<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CamAI 60-Second SaaS Ad Commercial Verification</title>
  <style>
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 30px;
      text-align: center;
    }
    h1 {
      color: #00f0ff;
      font-size: 28px;
      margin-bottom: 5px;
    }
    p.sub {
      color: #94a3b8;
      font-size: 16px;
      margin-bottom: 25px;
    }
    .video-card {
      max-width: 1000px;
      margin: 0 auto 30px auto;
      background: #0f172a;
      border: 1px solid #00f0ff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.15);
    }
    video {
      width: 100%;
      border-radius: 8px;
      outline: none;
    }
    .nav-buttons {
      margin-top: 15px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    button {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      transition: all 0.2s ease;
    }
    button:hover {
      background: #00f0ff;
      color: #090d16;
      box-shadow: 0 0 10px #00f0ff;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 30px auto;
    }
    .grid-card {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
    }
    .grid-card img {
      width: 100%;
      border-radius: 6px;
    }
    .grid-card label {
      display: block;
      margin-top: 8px;
      color: #38bdf8;
      font-weight: bold;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>CamAI 60-Second Enterprise SaaS Commercial</h1>
  <p class="sub">4K-Quality Master Video Render • 1080p @ 30 FPS • Synchronized Neural Voiceover & Synth Soundtrack</p>
  
  <div class="video-card">
    <video id="adVideo" src="videos/CamAI_60s_SaaS_Ad.mp4" controls autoplay muted></video>
    <div class="nav-buttons">
      <button onclick="seekTo(1.5)">01. Hook (1.5s)</button>
      <button onclick="seekTo(8.5)">02. The Problem (8.5s)</button>
      <button onclick="seekTo(16.5)">03. Meet CamAI (16.5s)</button>
      <button onclick="seekTo(24.0)">04. Bounding Boxes (24.0s)</button>
      <button onclick="seekTo(28.5)">05. Restricted Zone (28.5s)</button>
      <button onclick="seekTo(32.0)">06. Line Crossing (32.0s)</button>
      <button onclick="seekTo(39.0)">07. Toast Alerts (39.0s)</button>
      <button onclick="seekTo(47.5)">08. AI Mesh Value (47.5s)</button>
      <button onclick="seekTo(54.0)">09. Final CTA (54.0s)</button>
    </div>
  </div>
  
  <script>
    const v = document.getElementById('adVideo');
    function seekTo(sec) {
      v.currentTime = sec;
      v.play();
    }
  </script>
</body>
</html>
