version: '3.8'

services:
  camai-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: camai-engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - CAMAI_ENV=production
      - OPENCV_FFMPEG_CAPTURE_OPTIONS=rtsp_transport;tcp
    volumes:
      - ./uploads:/app/uploads
      - ./models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  default:
    name: camai-network
