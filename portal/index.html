<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>CamAI — Enterprise AI CCTV Platform</title>
    <!-- Theme resolved before first paint, from the same key ThemeContext writes.
         Must stay inline and synchronous — deferring it reintroduces the flash. -->
    <script>
      (function () {
        try {
          if (localStorage.getItem("camai-theme") === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) { /* private mode — light is the default, nothing to do */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
